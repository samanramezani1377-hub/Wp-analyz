name: Plugin smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax checks
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP smoke tests
        run: php tests/smoke.php
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax checks
        run: node --check assets/js/tracker.js && node --check assets/js/tracker-basic.js
      - name: Advanced tracker smoke tests
        run: node tests/tracker-smoke.js
      - name: Aggregate-only tracker smoke tests
        run: node tests/basic-tracker-smoke.js
